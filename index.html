
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Viewer</title>

    <!-- Discourage search engine indexing -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">

    <meta name="referrer" content="no-referrer">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #263247;
        }

        header h3 {
            font-size: 16px;
        }

        button {
            background: #2563eb;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        #viewer {
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        #loading {
            position: absolute;
            inset: 0;
            background: #080b12;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            font-size: 14px;
            color: #93c5fd;
        }

        .spinner {
            width: 25px;
            height: 25px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<header>
    <h3>Website Viewer</h3>
    <button onclick="fullscreen()">Full Screen</button>
</header>

<div id="viewer">

    <div id="loading">
        <div class="spinner"></div>
        Loading website...
    </div>

    <!-- REPLACE THIS URL -->
    <iframe
        id="website"
        src="https://example.com"
        title="Embedded website"
        referrerpolicy="no-referrer"
        allowfullscreen
        onload="document.getElementById('loading').style.display='none'">
    </iframe>

</div>

<script>
    function fullscreen() {
        const iframe = document.getElementById("website");

        if (iframe.requestFullscreen) {
            iframe.requestFullscreen();
        }
    }
</script>

</body>
</html>
